<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Institute Dashboard | Blockchain Certificate System</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7fb;
        }

        /* Top Navbar */
        .navbar {
            background: #1e3c72;
            color: white;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-weight: 600;
        }

        /* Dashboard Content */
        .dashboard {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #1e3c72;
            margin-bottom: 20px;
        }

        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #1e3c72;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #16325c;
        }

        .note {
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <h2>Institute Dashboard</h2>
    <a href="/logout">Logout</a>
</div>

<!-- Main Content -->
<div class="dashboard">

    <div class="card">
        <h3>Bulk Certificate Upload</h3>

        <form action="/upload" method="post" enctype="multipart/form-data">
            <input type="file" name="file" required>
            <button type="submit">Upload Excel</button>
        </form>

        <p class="note">
            Upload an Excel or CSV file containing student details to generate certificates in bulk.
        </p>
    </div>

</div>

<footer>
    © 2025 Blockchain Certificate System | Institute Panel
</footer>

</body>
</html>
